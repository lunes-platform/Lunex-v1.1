# =============================================================================
# Security headers for the faucet web page (GET /faucet), included inside the
# `location = /faucet` blocks of nginx.prod.conf (sandbox.lunes.io) and
# nginx.testnet.conf.
#
# A location that declares add_header does NOT inherit the server-level ones,
# so the full set is repeated here. The page has no inline <script> (JS/CSS
# live in /faucet/assets/*), so script-src needs only 'self' + Turnstile.
# style-src keeps 'unsafe-inline' only for the attributes the Turnstile
# widget sets on its container.
# =============================================================================
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options           "DENY" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-XSS-Protection          "0" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Robots-Tag              "noindex, nofollow" always;
