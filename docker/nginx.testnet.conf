# =============================================================================
# Lunex DEX — Nginx Testnet / Community-Beta Config (TEMPLATE)
#
# Rendered at container start by the official nginx image entrypoint
# (envsubst, /etc/nginx/templates/*.template → /etc/nginx/conf.d/). Only
# variables matching NGINX_ENVSUBST_FILTER=^LUNEX_ are substituted, so nginx
# runtime variables ($host, $remote_addr, …) are left untouched.
#
# Required env (set by docker-compose.testnet.yml from docker/.env.testnet):
#   LUNEX_TESTNET_DOMAIN     public host name           (lunex-sandbox.lunes.io)
#   LUNEX_TESTNET_CERT_NAME  /etc/letsencrypt/live/<name>/ (defaults to domain)
#   LUNEX_TESTNET_RPC_WSS    Lunes testnet RPC for CSP  (wss://testnet.lunes.io)
#   LUNEX_ADMIN_ALLOW_CIDR   who may reach /admin       (127.0.0.1/32 = nobody)
#   LUNEX_CSP_EXTRA_CONNECT  extra connect-src origins, space separated
#   LUNEX_CSP_FAUCET_ORIGIN  origin of REACT_APP_FAUCET_URL if not same-origin ("")
#   LUNEX_CSP_SENTRY_ORIGIN  Sentry ingest origin of REACT_APP_SENTRY_DSN       ("")
# Every LUNEX_* above MUST be defined in the container env (empty is fine):
# envsubst leaves undefined ones as literal ${...}, which nginx rejects.
#                            (e.g. the exact Sentry ingest host); may be empty
#
# Parity with nginx.prod.conf (IN-02): HSTS, strict CSP, Permissions-Policy,
# server_tokens off, XFF overwrite, auth/order/faucet rate limits, catch-all.
# =============================================================================

server_tokens off;                                   # IN-06

# IN-11: enable once the zone is proxied by Cloudflare (docs/security/cloudflare-waf.md)
# include /etc/nginx/snippets/cloudflare-realip.conf;

# Docker embedded DNS — lets optional services (admin, faucet, subquery) be
# absent without breaking nginx start-up (variables in proxy_pass).
resolver 127.0.0.11 valid=30s ipv6=off;

# ── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_global:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_orders:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=5r/m;
limit_req_zone $binary_remote_addr zone=frontend:10m     rate=200r/m;
limit_req_zone $binary_remote_addr zone=graphql:10m      rate=30r/m;
# Faucet drips (POST) per IP; GETs (status) use api_global only.
map $request_method $faucet_drip_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $faucet_drip_key    zone=faucet:10m       rate=2r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream api_backend {
    server api:4000;
    keepalive 16;
}

upstream ws_backend {
    server api:4001;
}

upstream frontend_backend {
    server frontend:80;
    keepalive 8;
}

# ── HTTP → HTTPS redirect (+ ACME) ───────────────────────────────────────────
server {
    listen 80;
    server_name ${LUNEX_TESTNET_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — testnet DEX ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ${LUNEX_TESTNET_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${LUNEX_TESTNET_CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${LUNEX_TESTNET_CERT_NAME}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${LUNEX_TESTNET_CERT_NAME}/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL_testnet:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers (no location below may use add_header, except
    #    `= /faucet`, which includes the full faucet-page-headers.conf set) ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "0" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    # Same policy as production (see nginx.prod.conf for the rationale of each
    # directive); style-src keeps 'unsafe-inline' for styled-components.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://${LUNEX_TESTNET_DOMAIN} wss://${LUNEX_TESTNET_DOMAIN} ${LUNEX_TESTNET_RPC_WSS} wss://relay.walletconnect.org https://rpc.walletconnect.org https://verify.walletconnect.org https://verify.walletconnect.com https://pulse.walletconnect.org ${LUNEX_CSP_FAUCET_ORIGIN} ${LUNEX_CSP_SENTRY_ORIGIN} ${LUNEX_CSP_EXTRA_CONNECT}; frame-src https://verify.walletconnect.org https://verify.walletconnect.com https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    # Staged rollout of future CSP changes:
    # add_header Content-Security-Policy-Report-Only "<candidate policy>; report-uri /api/v1/csp-report" always;
    add_header X-Robots-Tag              "noindex, nofollow" always;
    add_header X-Environment             "testnet" always;

    limit_conn conn_limit 20;
    client_body_timeout     10s;
    client_header_timeout   10s;
    keepalive_timeout       30s;
    send_timeout            10s;
    client_max_body_size    1m;
    client_body_buffer_size 16k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;

    # ── REST API ──
    location /api/ {
        limit_req zone=api_global burst=30 nodelay;
        limit_req_status 429;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;      # IN-03
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header  X-Powered-By;
    }

    # ── Orders (stricter) ──
    location /api/v1/orders {
        limit_req zone=api_orders burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_hide_header  X-Powered-By;
    }

    # ── Auth / session (stricter) ──
    location ~ ^/api/v1/(auth|user) {
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  X-Powered-By;
    }

    # ── WebSocket ──
    location /ws {
        limit_conn conn_limit 5;
        proxy_pass         http://ws_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Faucet (testnet tokens; Turnstile-protected in the app) ──
    # `= /faucet` is the HTML page (GET) and the drip (POST): it gets its own
    # CSP from the snippet (Turnstile script/frame, no wasm/walletconnect).
    # The faucet zone only counts POSTs (see map above).
    location = /faucet {
        include /etc/nginx/snippets/faucet-page-headers.conf;
        limit_req zone=faucet burst=2 nodelay;
        limit_req zone=api_global burst=30 nodelay;
        limit_req_status 429;
        set $faucet_upstream http://faucet:3333;
        proxy_pass         $faucet_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header  X-Powered-By;
    }

    # /faucet/config, /faucet/status, /faucet/assets/* (JSON + static JS/CSS)
    # inherit the server-level headers. Drip = POST /faucet (above).
    location /faucet/ {
        limit_req zone=faucet burst=2 nodelay;
        limit_req zone=api_global burst=30 nodelay;
        limit_req_status 429;
        set $faucet_upstream http://faucet:3333;
        proxy_pass         $faucet_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header  X-Powered-By;
    }

    # ── SubQuery GraphQL — internal only (IN-02) ──
    # spot-api talks to subquery-query directly over the Docker network; the
    # public endpoint is closed (playground also disabled in compose).
    location /graphql {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        limit_req zone=graphql burst=10 nodelay;
        set $subquery_upstream http://subquery-query:3000;
        proxy_pass         $subquery_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
    }

    # ── Admin panel — IP allowlist (IN-02) ──
    # LUNEX_ADMIN_ALLOW_CIDR defaults to 127.0.0.1/32, i.e. closed to the
    # internet. Set it to the operators' VPN / office egress CIDR, or put
    # Cloudflare Access in front (docs/security/cloudflare-waf.md). The admin
    # service itself is optional (compose profile `admin`): 502 when absent.
    location /admin {
        allow ${LUNEX_ADMIN_ALLOW_CIDR};
        deny all;
        limit_req zone=api_auth burst=10 nodelay;
        set $admin_upstream http://admin:3001;
        proxy_pass         $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://api_backend;
    }

    # ── Frontend (SPA catch-all) ──
    location / {
        limit_req zone=frontend burst=50 nodelay;
        proxy_pass         http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 404 = @frontend_fallback;
    }

    location @frontend_fallback {
        proxy_pass http://frontend_backend;
    }

    # ── Block scanners & probes ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(php|asp|aspx|jsp|cgi|env|git|svn)$ {
        return 444;
    }
}

# ── Catch-all: unknown Host headers / scans by IP ────────────────────────────
server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/${LUNEX_TESTNET_CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${LUNEX_TESTNET_CERT_NAME}/privkey.pem;
    return 444;
}
