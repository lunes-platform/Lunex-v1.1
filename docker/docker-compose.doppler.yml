# ─────────────────────────────────────────────────────────────────────────────
#  Lunex DEX — Docker Compose com Doppler (VPS produção)
#
#  Pré-requisito na VPS:
#    export DOPPLER_TOKEN=dp.st.prod.xxxx
#
#  Subir:
#    DOPPLER_TOKEN=dp.st.prod.xxxx doppler run -- \
#      docker compose -f docker/docker-compose.doppler.yml up -d
#
#  O Doppler injeta todas as variáveis de ambiente antes do compose iniciar.
#  O compose repassa apenas as vars necessárias para cada container.
#  Nenhum arquivo .env toca o disco da VPS.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunex_spot
      POSTGRES_USER: ${DB_USER:-lunex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no Doppler}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Porta não exposta externamente — apenas na rede interna Docker
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lunex} -d lunex_spot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no Doppler}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      # REDISCLI_AUTH keeps the password out of `ps`/docker inspect args.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Spot API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ../spot-api
      dockerfile: ../docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Doppler já injetou essas vars no processo do compose — apenas repassamos
      NODE_ENV: production
      PORT: "4000"
      WS_PORT: "4001"
      # nginx overwrites X-Forwarded-For with $remote_addr → exactly 1 hop.
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://${DB_USER:-lunex}:${DB_PASSWORD}@postgres:5432/lunex_spot?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Secrets sensíveis — vêm do Doppler, nunca escritos em arquivo
      RELAYER_SEED: ${RELAYER_SEED}
      BRIDGE_ADMIN_SEED: ${BRIDGE_ADMIN_SEED}
      ADMIN_SECRET: ${ADMIN_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no Doppler}
      LUNES_WS_URL: ${LUNES_WS_URL}
      # spot-api production guards (productionGuards.ts)
      SIGNING_DOMAIN: ${SIGNING_DOMAIN:-lunex.lunes.io}
      LUNES_GENESIS_HASH: ${LUNES_GENESIS_HASH:?Defina LUNES_GENESIS_HASH no Doppler}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-https://lunex.lunes.io}
      ATTESTOR_SEED: ${ATTESTOR_SEED:?Defina ATTESTOR_SEED no Doppler (≠ RELAYER_SEED)}
      ALLOWED_WS_ORIGINS: ${ALLOWED_WS_ORIGINS}
      FACTORY_CONTRACT_ADDRESS: ${FACTORY_CONTRACT_ADDRESS}
      NATIVE_TOKEN_ADDRESS: ${NATIVE_TOKEN_ADDRESS}
      SPOT_CONTRACT_ADDRESS: ${SPOT_CONTRACT_ADDRESS:-}
      SPOT_CONTRACT_METADATA_PATH: ${SPOT_CONTRACT_METADATA_PATH}
      REWARDS_ENABLED: ${REWARDS_ENABLED:-false}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
      STAKING_CONTRACT_ADDRESS: ${STAKING_CONTRACT_ADDRESS:-}
      STAKING_CONTRACT_METADATA_PATH: ${STAKING_CONTRACT_METADATA_PATH:-./abis/Staking.json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      # Só expõe para loopback — nginx faz o proxy público
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:4001:4001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Frontend DEX ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../lunes-dex-main
      dockerfile: ../docker/Dockerfile.frontend
      args:
        REACT_APP_NETWORK: mainnet
        REACT_APP_SPOT_API_URL: ${REACT_APP_SPOT_API_URL}
        REACT_APP_RPC_MAINNET: ${REACT_APP_RPC_MAINNET}
        REACT_APP_FACTORY_CONTRACT: ${FACTORY_CONTRACT_ADDRESS}
        REACT_APP_ROUTER_CONTRACT: ${ROUTER_CONTRACT_ADDRESS:-}
        REACT_APP_STAKING_CONTRACT: ${STAKING_CONTRACT_ADDRESS:-}
        REACT_APP_REWARDS_CONTRACT: ${REWARDS_CONTRACT_ADDRESS:-}
        REACT_APP_TOKEN_WLUNES: ${WLUNES_ADDRESS:-}
        REACT_APP_TOKEN_LUSDT: ${LUSDT_ADDRESS:-}
        REACT_APP_TOKEN_LBTC: ${LBTC_ADDRESS:-}
        REACT_APP_TOKEN_LETH: ${LETH_ADDRESS:-}
        REACT_APP_TOKEN_GMC: ${GMC_ADDRESS:-}
        REACT_APP_TOKEN_LUP: ${LUP_ADDRESS:-}
        REACT_APP_ENABLE_STAKING: "true"
        REACT_APP_ENABLE_REWARDS: "true"
        REACT_APP_DEV_MODE: "false"
        REACT_APP_API_URL: ${REACT_APP_SPOT_API_URL}
        REACT_APP_SPOT_WS_URL: ${REACT_APP_SPOT_WS_URL:-}
        REACT_APP_GENESIS_HASH: ${LUNES_GENESIS_HASH:?Defina LUNES_GENESIS_HASH no Doppler}
        REACT_APP_LUNES_GENESIS_HASH: ${LUNES_GENESIS_HASH:?Defina LUNES_GENESIS_HASH no Doppler}
        REACT_APP_CHAIN_NAME: ${REACT_APP_CHAIN_NAME:-Lunes}
        REACT_APP_SIGNING_DOMAIN: ${SIGNING_DOMAIN:-lunex.lunes.io}
        REACT_APP_WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:-}
        REACT_APP_WNATIVE_CONTRACT: ${WLUNES_ADDRESS:-}
        REACT_APP_LISTING_MANAGER_CONTRACT: ${LISTING_MANAGER_CONTRACT_ADDRESS:-}
        REACT_APP_LISTING_FEE_TOKEN: ${LISTING_FEE_TOKEN:-}
        REACT_APP_COPY_VAULT_CONTRACT: ${COPY_VAULT_CONTRACT:-}
        REACT_APP_SPOT_SETTLEMENT_CONTRACT: ${SPOT_CONTRACT_ADDRESS:-}
        REACT_APP_FAUCET_URL: ""
        REACT_APP_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        REACT_APP_SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
        REACT_APP_VERSION: ${IMAGE_TAG:-dev}
        REACT_APP_MAINTENANCE: ${MAINTENANCE:-false}
        REACT_APP_FEATURE_MARGIN: ${FEATURE_MARGIN:-false}
        REACT_APP_NATIVE_EXISTENTIAL_DEPOSIT_LUNES: ${NATIVE_EXISTENTIAL_DEPOSIT_LUNES:-}
        REACT_APP_NATIVE_FEE_BUFFER_LUNES: ${NATIVE_FEE_BUFFER_LUNES:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  # ── Admin Panel ───────────────────────────────────────────────────────────
  admin:
    build:
      context: ../lunex-admin
      dockerfile: ../docker/Dockerfile.admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-lunex}:${DB_PASSWORD}@postgres:5432/lunex_spot?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Defina NEXTAUTH_SECRET no Doppler}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://admin.lunex.io}
    ports:
      - "127.0.0.1:3001:3001"

  # ── nginx (reverse proxy público) ────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
      - admin
    volumes:
      # IN-09: nginx.prod.conf is an http-context include (no events{}/http{}).
      # It is also an envsubst template (^LUNEX_ vars): mounted under
      # templates/ and rendered to conf.d/default.conf by /docker-entrypoint.sh.
      - ./nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      NGINX_ENVSUBST_FILTER: "^LUNEX_"
      # Exact Sentry ingest origin of FRONTEND_SENTRY_DSN (empty = no Sentry).
      LUNEX_CSP_SENTRY_ORIGIN: ${SENTRY_INGEST_ORIGIN:-}
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata:
  redisdata:
