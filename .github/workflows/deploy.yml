name: Lunex CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target (prod | dev | rollback)'
        required: true
        default: 'prod'
        type: choice
        options: [prod, dev, rollback]
      skip_tests:
        description: 'Skip tests (emergency deploy only)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

# Only allow one deploy per environment at a time
concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  # ── 1. Secret & Dependency Scanning ─────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit spot-api
        run: npm install --prefix spot-api --ignore-scripts && npm audit --prefix spot-api --audit-level=high

      - name: Audit frontend
        run: npm install --prefix lunes-dex-main --ignore-scripts && npm audit --prefix lunes-dex-main --audit-level=high

      - name: Audit admin
        run: npm install --prefix lunex-admin --ignore-scripts && npm audit --prefix lunex-admin --audit-level=high

  # ── 2. Type Check + Lint ─────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: security
    if: ${{ !inputs.skip_tests }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Typecheck spot-api
        run: |
          npm install --prefix spot-api
          cd spot-api && npx tsc --noEmit

      - name: Typecheck frontend
        run: |
          npm install --prefix lunes-dex-main
          cd lunes-dex-main && npx tsc --noEmit

      - name: Typecheck admin
        run: |
          npm install --prefix lunex-admin
          cd lunex-admin && npx tsc --noEmit

  # ── 3. Backend Tests ──────────────────────────────────────────────────────────
  test-api:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ !inputs.skip_tests }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lunex_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --prefix spot-api

      - name: Run Prisma migrations
        run: cd spot-api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/lunex_test

      - name: Run tests
        run: cd spot-api && npm test -- --forceExit --testPathIgnorePatterns='e2e'
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/lunex_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          JWT_SECRET: test-secret-not-for-production
          RELAYER_SEED: //Alice

  # ── 4. Build Docker Images ────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-api]
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    outputs:
      api_image: ${{ steps.meta-api.outputs.tags }}
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}
      admin_image: ${{ steps.meta-admin.outputs.tags }}
      image_tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── API ──
      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push API image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./spot-api
          file: ./docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ── Frontend ──
      - name: Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push Frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./lunes-dex-main
          file: ./docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            REACT_APP_NETWORK=${{ github.ref == 'refs/heads/main' && 'mainnet' || 'testnet' }}
            REACT_APP_DEV_MODE=${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ── Admin ──
      - name: Docker metadata (Admin)
        id: meta-admin
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/admin
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push Admin image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./lunex-admin
          file: ./docker/Dockerfile.admin
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ── 5. Container Security Scan (Trivy) ───────────────────────────────────────
  scan-images:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      security-events: write
      packages: read

    strategy:
      matrix:
        image: [api, frontend, admin]

    steps:
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.image }} with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.build.outputs.image_tag }}
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Report only, don't fail (non-zero to block: '1')

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: 'trivy-${{ matrix.image }}.sarif'
          category: 'trivy-${{ matrix.image }}'

  # ── 6. Deploy to Dev ─────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev
    runs-on: ubuntu-latest
    needs: [build, scan-images]
    if: |
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    environment:
      name: sandbox
      url: https://lunex-sandbox.lunes.io

    steps:
      - name: Deploy Sandbox to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        # IN-08: the CI key is a dedicated user whose authorized_keys entry
        # forces /usr/local/bin/lunex-deploy-ssh → sudo lunex-deploy (fixed
        # compose files, validated tag). No shell, no docker group, no sudo docker.
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_CI_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          script: lunex-deploy sandbox ${{ needs.build.outputs.image_tag }}

  # ── 7. Deploy to Production ───────────────────────────────────────────────────
  deploy-prod:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build, scan-images]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    environment:
      name: production
      url: https://lunex.lunes.io

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        # IN-08: the CI key is a dedicated user whose authorized_keys entry
        # forces /usr/local/bin/lunex-deploy-ssh → sudo lunex-deploy (fixed
        # compose files, validated tag). No shell, no docker group, no sudo docker.
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_CI_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 180s
          script: lunex-deploy prod ${{ needs.build.outputs.image_tag }}

      - name: Verify production health
        run: |
          sleep 15
          response=$(curl -sf --max-time 10 https://lunex.lunes.io/health || echo "FAILED")
          if [[ "$response" == "FAILED" ]]; then
            echo "❌ Post-deploy health check failed!"
            exit 1
          fi
          echo "✅ Production is live: $response"

      - name: Notify deployment
        if: always()
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1.27.1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} Lunex DEX *${{ job.status }}* deployed to production\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*Message:* ${{ github.event.head_commit.message }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ── 8. Rollback (manual trigger only) ────────────────────────────────────────
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'rollback'
    environment: production

    steps:
      - name: Rollback to previous image
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        # IN-08: the CI key is a dedicated user whose authorized_keys entry
        # forces /usr/local/bin/lunex-deploy-ssh → sudo lunex-deploy (fixed
        # compose files, validated tag). No shell, no docker group, no sudo docker.
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_CI_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: lunex-deploy rollback
